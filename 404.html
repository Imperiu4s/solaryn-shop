  <style>
    body { overflow: hidden; }
    #errSky { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
    .err { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); width: min(560px, calc(100vw - 24px)); padding: 24px; color: var(--text); background: var(--panel); box-shadow: inset 0 2px 0 var(--hi), inset 0 -2px 0 var(--lo), 0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), 6px 12px 0 0 rgba(0, 0, 0, .35); }
    .err b { display: block; font: 400 64px/1 var(--f-block); color: var(--gold); margin-bottom: 8px; }
    .err h1 { font: 400 24px/1.15 var(--f-block); margin: 0 0 10px; }
    .err p { margin: 0 0 18px; font-size: 14px; color: var(--text-dim); }
    .err code { font: 400 12px var(--f-mono); word-break: break-all; background: none; padding: 0; color: var(--text-faint); }
    .err-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .err-actions a { display: inline-flex; align-items: center; text-decoration: none; }
  </style>

  <canvas id="errSky" aria-hidden="true"></canvas>

    <b aria-hidden="true">404</b>

    </div>
    <code id="errPath"></code>

  <script src="/404.js?v=20261106a" defer></script>
