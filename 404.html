<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.overclockgame.hu:8908 https://cdn.discordapp.com https://media.discordapp.net; connect-src 'self' https://api.overclockgame.hu:8908; media-src 'self' blob: https://api.overclockgame.hu:8908; font-src 'self' data:; frame-src https://discord.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>A keresett oldal nem található - SolarCenter</title>
  <meta name="description" content="A keresett oldal nem található a SolarCenteren. Térj vissza a főoldalra, vagy nézd meg a gyakori kérdéseket." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0a0a0d" />
  <link rel="icon" type="image/png" href="/assets/solaryn-icon.png" />
  <link rel="apple-touch-icon" href="/assets/solaryn-icon.png" />

  <script src="/theme.js?v=20260909b"></script>
  <link rel="stylesheet" href="/style.css?v=20260909b" />
  <link rel="stylesheet" href="/ui.css?v=20260909b" />
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .err-wrap { position: relative; z-index: 1; text-align: center; max-width: 520px; width: 100%; }
    .err-brand { display: inline-flex; align-items: center; gap: 11px; margin-bottom: 34px; }
    .err-brand img { width: 38px; height: 38px; filter: drop-shadow(0 0 12px var(--gold-glow)); }
    .err-code {
      font-size: clamp(84px, 22vw, 138px); font-weight: 900; line-height: .9; letter-spacing: -.04em;
      background: linear-gradient(120deg, var(--gold) 10%, var(--orange) 50%, var(--gold-2) 90%);
      background-size: 220% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: errSheen 5s linear infinite;
      filter: drop-shadow(0 10px 40px var(--gold-glow));
    }
    @keyframes errSheen { to { background-position: 220% center; } }
    .err-title { font-size: 22px; font-weight: 800; margin: 14px 0 10px; }
    .err-text { color: var(--text-dim); font-size: 14px; line-height: 1.7; margin-bottom: 30px; }
    .err-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .err-actions a {
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 26px; border-radius: 11px; font-weight: 700; font-size: 14px; margin-top: 0;
      width: auto; min-width: 160px;
    }
    .err-actions .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--text-dim); }
    .err-path {
      margin-top: 28px; font-size: 12px; color: var(--text-faint); word-break: break-all;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>

  <main class="err-wrap">
    <a class="err-brand" href="/" aria-label="Vissza a SolarCenter főoldalára">
      <img src="/assets/solaryn-icon.png" alt="" width="38" height="38" />
      <span class="auth-brand-name">SOLARCENTER<small>Solaryn Network</small></span>
    </a>

    <div class="err-code" aria-hidden="true">404</div>
    <h1 class="err-title">Ez az oldal eltűnt a térképről</h1>
    <p class="err-text">
      A keresett cím nem létezik, vagy időközben megváltozott. Ha egy régi
      linkről érkeztél, valószínűleg a főoldalról már egy kattintással
      megtalálod, amit keresel.
    </p>

    <div class="err-actions">
      <a class="btn-glow" href="/">Vissza a főoldalra</a>
      <a class="btn-outline" href="/#faq">Gyakori kérdések</a>
    </div>

    <p class="err-path">Kért cím: <span id="errPath"></span></p>
  </main>

  <script src="/404.js?v=20260923a"></script>
</body>
</html>
